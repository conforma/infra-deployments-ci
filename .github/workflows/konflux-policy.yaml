name: konflux-policy
on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
    inputs:
      release_dir:
        description: Release directory under releases/
        type: string
        required: true

permissions:
  contents: read

# Serialize the complete release so acceptance and publication cannot overtake
# another release. A running publication must never be cancelled by a new push.
concurrency:
  group: konflux-release
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          read-auth: ${{ secrets.REGISTRY_READ_AUTH_JSON }}
      - name: Install acceptance tools
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.2.1
      - name: Select release manifest
        env:
          RELEASE_DIR: ${{ inputs.release_dir }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          manifest=$(python3 hack/select-release.py)
          ./hack/release.sh validate "$manifest"
          mkdir release-input
          cp "$manifest" release-input/images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-manifest
          path: release-input/images.json
          if-no-files-found: error
      - name: Test recorded candidate
        run: ./hack/release.sh acceptance release-input/images.json acceptance-result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-acceptance
          path: |
            acceptance-result/acceptance.json
            acceptance-result/*.log
            acceptance-result/reports/
            acceptance-result/fixtures/
          if-no-files-found: warn

  publish:
    if: github.repository == 'conforma/infra-deployments-ci'
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-manifest
          path: release-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-acceptance
          path: release-evidence
      - name: Catalog token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.EC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.EC_AUTOMATION_KEY }}
          owner: conforma
          repositories: tekton-catalog
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: conforma/tekton-catalog
          ref: konflux
          fetch-depth: 0
          path: tekton-catalog
          token: ${{ steps.app-token.outputs.token }}
      - name: Promote tested candidate and update catalog
        env:
          CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
          CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
          EC_USER: ${{ secrets.BUNDLE_PUSH_USER_EC }}
          EC_PASS: ${{ secrets.BUNDLE_PUSH_PASS_EC }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/release-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          python3 - <<'PY'
          import base64, json, os
          auths = {}
          for repository, prefix in [('conforma', 'CONFORMA'), ('enterprise-contract', 'EC')]:
              credential = os.environ[prefix + '_USER'] + ':' + os.environ[prefix + '_PASS']
              auths['quay.io/' + repository] = {'auth': base64.b64encode(credential.encode()).decode()}
          with open(os.open(os.environ['REGISTRY_AUTH_FILE'], os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'w') as stream:
              json.dump({'auths': auths}, stream)
          PY
          ./hack/release.sh publish release-input/images.json release-evidence/acceptance.json tekton-catalog publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-result
          path: publication.json
          if-no-files-found: warn
