name: Release tools
description: Install the shared release manifest and OCI tools
inputs:
  read-auth:
    description: Optional Docker config JSON containing read-only registry credentials
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: acceptance/go.mod
        cache-dependency-path: acceptance/go.sum
    - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b
    - shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/release-venv"
        "$RUNNER_TEMP/release-venv/bin/pip" install -r hack/release/requirements.txt
        echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"
    - shell: bash
      env:
        READ_AUTH_JSON: ${{ inputs.read-auth }}
      run: |
        set -euo pipefail
        if [[ -n "$READ_AUTH_JSON" ]]; then
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(os.environ['READ_AUTH_JSON'])
          if not isinstance(config.get('auths'), dict):
              raise SystemExit('Read authentication must be a Docker config with auths')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-read-auth'
          directory.mkdir(mode=0o700, exist_ok=True)
          path = directory / 'config.json'
          path.write_text(json.dumps(config))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'DOCKER_CONFIG={directory}\nREGISTRY_AUTH_FILE={path}\n')
          PY
        fi
