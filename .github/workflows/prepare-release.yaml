name: Prepare release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'conforma/infra-deployments-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          read-auth: ${{ secrets.REGISTRY_READ_AUTH_JSON }}
      - name: Install bundle builder
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/tektoncd/cli/releases/download/v0.46.1/tkn_0.46.1_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin tkn
      - name: Assemble and retain candidates
        env:
          CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
          CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
        run: |
          set -euo pipefail
          printf '%s' "$CONFORMA_PASS" | crane auth login quay.io -u "$CONFORMA_USER" --password-stdin
          ./hack/release.sh prepare prepared-release
          ./hack/release.sh check prepared-release/images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prepared-manifest
          path: prepared-release/images.json
          if-no-files-found: error

  changelog:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          read-auth: ${{ secrets.REGISTRY_READ_AUTH_JSON }}
      - name: Install YAML processor
        run: go install github.com/mikefarah/yq/v4@v4.54.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prepared-manifest
          path: prepared-release
      - name: Generate changelog using pinned candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="releases/$(date -u +%Y-%m-%dT%H:%M:%S)"
          ./hack/generate-changelog.sh prepared-release/images.json "$directory"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-pr-files
          path: releases/
          if-no-files-found: error
