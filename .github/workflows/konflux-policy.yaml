name: konflux-policy
on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
    inputs:
      release_dir:
        description: Release directory under releases/
        type: string
        required: true

permissions:
  contents: read

# Serialize the complete release so acceptance and publication cannot overtake
# another release. A running publication must never be cancelled by a new push.
concurrency:
  group: konflux-release
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          read-auth: ${{ secrets.REGISTRY_READ_AUTH_JSON }}
      - name: Install acceptance tools
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.2.1
      - name: Select and check release
        id: release
        env:
          RELEASE_DIR: ${{ inputs.release_dir }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_DIR" ]]; then
            directory=${RELEASE_DIR#releases/}
            [[ "$directory" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]*$ ]]
            manifests=("releases/$directory/images.json")
          else
            mapfile -t manifests < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- releases/ | grep -E '^releases/[^/]+/images.json$')
          fi
          [[ ${#manifests[@]} == 1 ]] || { echo 'Select exactly one release using manual dispatch'; exit 1; }
          manifest=${manifests[0]}
          ./hack/check-release-inputs.sh "$manifest"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "config=$(jq -r '.inputs.testInputs.configCommit' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "RELEASE_IMAGES=$GITHUB_WORKSPACE/$manifest" >> "$GITHUB_ENV"
          echo "RELEASE_CATALOG=$RUNNER_TEMP/release-catalog" >> "$GITHUB_ENV"
          bundle=$(jq -r '.components[] | select(.image == "quay.io/conforma/tekton-task") | .image+"@"+.digest' "$manifest")
          ./hack/extract-bundle-resources.sh "$bundle" "$RUNNER_TEMP/release-catalog" task tasks
          ./hack/extract-bundle-resources.sh "$bundle" "$RUNNER_TEMP/release-catalog" stepaction stepactions
          ./hack/check-release-inputs.sh "$manifest" "$RUNNER_TEMP/release-catalog"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.release.outputs.config }}
          path: test-config
          persist-credentials: false
      - name: Test recorded candidate
        env:
          ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/acceptance-result/reports
        run: |
          set -euo pipefail
          mkdir -p acceptance-result
          make -C test-config acceptance 2>&1 | tee acceptance-result/acceptance.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-acceptance
          path: acceptance-result/
          if-no-files-found: warn

  publish:
    if: github.repository == 'conforma/infra-deployments-ci'
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - name: Catalog token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.EC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.EC_AUTOMATION_KEY }}
          owner: conforma
          repositories: tekton-catalog
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: conforma/tekton-catalog
          ref: konflux
          fetch-depth: 0
          path: tekton-catalog
          token: ${{ steps.app-token.outputs.token }}
      - name: Promote tested candidate and update catalog
        env:
          CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
          CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
          EC_USER: ${{ secrets.BUNDLE_PUSH_USER_EC }}
          EC_PASS: ${{ secrets.BUNDLE_PUSH_PASS_EC }}
          MANIFEST: ${{ needs.acceptance.outputs.manifest }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/release-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          umask 077
          jq -n '{auths:{"quay.io/conforma":{auth:((env.CONFORMA_USER+":"+env.CONFORMA_PASS)|@base64)},"quay.io/enterprise-contract":{auth:((env.EC_USER+":"+env.EC_PASS)|@base64)}}}' > "$REGISTRY_AUTH_FILE"
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          ./hack/publish-release.sh "$MANIFEST" tekton-catalog 2>&1 | tee publication.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-result
          path: publication.log
          if-no-files-found: warn
