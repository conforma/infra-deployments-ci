---
name: konflux-policy

on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
    inputs:
      release_dir:
        description: 'Release date (e.g. 2026-08-11T17:36:11) — matches a directory under releases/'
        type: string
        required: true
      run_tag:
        description: 'Tag tested images as :konflux'
        type: boolean
        default: true
      run_tekton_task_bundle:
        description: 'Tag the tested tekton-task bundle as :konflux'
        type: boolean
        default: true
      run_tekton_catalog:
        description: 'Sync task definitions to tekton-catalog'
        type: boolean
        default: true
  # Disabled as part of konflux release freeze and ITN-2026-00051
  # schedule:
  #   # At 08:30 UTC on Tuesday
  #   - cron: '30 8 * * 2'

permissions:
  contents: read

# Serialize releases so one publication cannot interleave with another.
# A running publication must never be cancelled by a new push.
concurrency:
  group: konflux-release
  cancel-in-progress: false

jobs:
  acceptance-tests:
    runs-on: ubuntu-latest
    outputs:
      release-images: ${{ steps.release-images.outputs.images }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Read release images.json
      id: release-images
      env:
        RELEASE_DIR: ${{ inputs.release_dir }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [[ -n "$RELEASE_DIR" ]]; then
          # Normalize: accept bare date or full path
          RELEASE_DIR="${RELEASE_DIR#releases/}"
          IMAGES_FILE="releases/${RELEASE_DIR}/images.json"
        else
          IMAGES_FILE=$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" \
            | { grep '^releases/.*/images\.json$' || true; } | head -1)
        fi

        if [[ -z "$IMAGES_FILE" || ! -f "$IMAGES_FILE" ]]; then
          echo "ERROR: No images.json found" >&2
          exit 1
        fi
        echo "Using ${IMAGES_FILE}" >&2
        echo "images-file=${IMAGES_FILE}" >> "$GITHUB_OUTPUT"
        echo "images=$(jq -c . "$IMAGES_FILE")" >> "$GITHUB_OUTPUT"

    - name: Validate release inputs
      env:
        IMAGES_FILE: ${{ steps.release-images.outputs.images-file }}
      run: ./hack/check-release-inputs.sh "$IMAGES_FILE"

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: acceptance/go.mod

    - name: Install kind
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        install_only: true

    - name: Run acceptance tests
      env:
        RELEASE_IMAGES: ${{ github.workspace }}/${{ steps.release-images.outputs.images-file }}
      run: make acceptance

  tag:
    if: ${{ github.repository == 'conforma/infra-deployments-ci' && (github.event_name != 'workflow_dispatch' || inputs.run_tag != false) }}
    runs-on: ubuntu-latest
    needs: [acceptance-tests]

    steps:

    - name: Log in to quay.io/enterprise-contract
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        username: ${{ secrets.BUNDLE_PUSH_USER_EC }}
        password: ${{ secrets.BUNDLE_PUSH_PASS_EC }}
        registry: quay.io/enterprise-contract

    - name: Log in to quay.io/conforma
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        username: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        password: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
        registry: quay.io/conforma

    - name: Tag policy images
      env:
        RELEASE_IMAGES: ${{ needs.acceptance-tests.outputs.release-images }}
      run: |
        set -euo pipefail

        echo "$RELEASE_IMAGES" | jq -r '.policy[] | "\(.image)|\(.digest)|\(.mirrors | join(","))"' | \
          while IFS='|' read -r image digest mirrors; do
            echo "Updating ${image}:konflux (from digest ${digest})"
            skopeo copy --all --digestfile image.digest \
              "docker://${image}@${digest}" "docker://${image}:konflux"
            echo "Image digest: $(cat image.digest)"

            IFS=',' read -ra MIRROR_LIST <<< "$mirrors"
            for mirror in "${MIRROR_LIST[@]}"; do
              [[ -z "$mirror" ]] && continue
              echo "Updating ${mirror}:konflux"
              skopeo copy --all --digestfile image.digest \
                "docker://${image}@${digest}" "docker://${mirror}:konflux"
              echo "Image digest: $(cat image.digest)"
            done
          done

    - name: Tag CLI image from manifest
      env:
        RELEASE_IMAGES: ${{ needs.acceptance-tests.outputs.release-images }}
      run: |
        set -euo pipefail

        CLI=$(echo "$RELEASE_IMAGES" | jq -er '
          .components[] | select(.image == "quay.io/conforma/cli") | .image + "@" + .digest')

        echo "Tagging ${CLI} → quay.io/conforma/cli:konflux"
        skopeo copy --all --digestfile image.digest \
          "docker://${CLI}" "docker://quay.io/conforma/cli:konflux"
        echo "Image digest: $(cat image.digest)"

  extract-task-definitions:
    if: ${{ github.repository == 'conforma/infra-deployments-ci' && !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.run_tekton_task_bundle != false || inputs.run_tekton_catalog != false) }}
    runs-on: ubuntu-latest
    needs: [acceptance-tests, tag]

    outputs:
      bundle: ${{ steps.bundle.outputs.ref }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # This job pushes to tekton-catalog via the App token, not this repo's
        # GITHUB_TOKEN, so don't persist it in the checkout's git config.
        persist-credentials: false

    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Install yq
      uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e # v4.54.3

    - name: Log in to quay.io/conforma
      env:
        CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
      run: crane auth login quay.io -u "$CONFORMA_USER" -p "$CONFORMA_PASS"

    - name: Resolve release bundle from manifest
      id: bundle
      env:
        RELEASE_IMAGES: ${{ needs.acceptance-tests.outputs.release-images }}
      run: |
        set -euo pipefail

        echo "ref=$(echo "$RELEASE_IMAGES" | jq -er '
          .components[] | select(.image == "quay.io/conforma/tekton-task") |
          .image + "@" + .digest')" >> "$GITHUB_OUTPUT"

    - name: Extract task and StepAction definitions from release bundle
      env:
        BUNDLE: ${{ steps.bundle.outputs.ref }}
      run: |
        set -euo pipefail

        ./hack/extract-bundle-resources.sh "$BUNDLE" /tmp/catalog-tasks task tasks
        ./hack/extract-bundle-resources.sh "$BUNDLE" /tmp/catalog-tasks stepaction stepactions

    - name: Upload task definitions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: task-definitions
        path: /tmp/catalog-tasks

  tekton-task-bundle:
    if: ${{ github.repository == 'conforma/infra-deployments-ci' && !cancelled() && !failure() && needs.extract-task-definitions.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_tekton_task_bundle != false) }}
    runs-on: ubuntu-latest
    needs: [extract-task-definitions]

    steps:
    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Log in to quay.io/conforma
      env:
        CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
      run: crane auth login quay.io -u "$CONFORMA_USER" -p "$CONFORMA_PASS"

    # The bundle acceptance tested was assembled and pushed during release
    # preparation; publication only moves :konflux to that recorded digest.
    # The candidate-* retention tag in the manifest keeps the digest
    # reachable if :konflux moves again.
    - name: Tag tested bundle as :konflux
      env:
        BUNDLE: ${{ needs.extract-task-definitions.outputs.bundle }}
      run: |
        set -euo pipefail

        echo "Tagging ${BUNDLE} → quay.io/conforma/tekton-task:konflux"
        crane tag "$BUNDLE" konflux
        echo "Tagged tekton-task bundle ${BUNDLE} as :konflux"

  tekton-catalog:
    if: ${{ github.repository == 'conforma/infra-deployments-ci' && !cancelled() && !failure() && needs.extract-task-definitions.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_tekton_catalog != false) }}
    runs-on: ubuntu-latest
    needs: [extract-task-definitions]

    steps:
    - name: Download task definitions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: task-definitions
        path: /tmp/catalog-tasks

    - name: Generate token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ secrets.EC_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.EC_AUTOMATION_KEY }}
        owner: conforma
        repositories: tekton-catalog
        # Least privilege: the token only checks out and pushes to tekton-catalog.
        permission-contents: write

    - name: Checkout tekton-catalog
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: conforma/tekton-catalog
        ref: konflux
        path: tekton-catalog
        token: ${{ steps.app-token.outputs.token }}

    - name: Push task definitions to konflux branch
      run: |
        set -euo pipefail

        cd tekton-catalog

        cp -r /tmp/catalog-tasks/tasks/* tasks/
        mkdir -p stepactions
        cp -r /tmp/catalog-tasks/stepactions/* stepactions/

        git add tasks/ stepactions/

        if git diff --cached --quiet; then
          echo "No changes to task or step-action definitions"
          exit 0
        fi

        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git commit -m "Update task definitions from tested bundle" \
          -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        git push origin konflux
