---
name: konflux-policy

on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
    inputs:
      release_dir:
        description: 'Release date (e.g. 2026-08-11T17:36:11) — matches a directory under releases/'
        type: string
        required: true
      run_tag:
        description: 'Tag tested images as :konflux'
        type: boolean
        default: true
      run_tekton_task_bundle:
        description: 'Rebuild tekton-task bundle with updated policy digest'
        type: boolean
        default: true
      run_tekton_catalog:
        description: 'Sync task definitions to tekton-catalog'
        type: boolean
        default: true
  # Disabled as part of konflux release freeze and ITN-2026-00051
  # schedule:
  #   # At 08:30 UTC on Tuesday
  #   - cron: '30 8 * * 2'

permissions:
  contents: read

jobs:
  acceptance-tests:
    runs-on: ubuntu-latest
    outputs:
      bundle-digests: ${{ steps.resolve-digests.outputs.bundle-digests }}
      release-images: ${{ steps.release-images.outputs.images }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Read release images.json
      id: release-images
      env:
        RELEASE_DIR: ${{ inputs.release_dir }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [[ -n "$RELEASE_DIR" ]]; then
          # Normalize: accept bare date or full path
          RELEASE_DIR="${RELEASE_DIR#releases/}"
          IMAGES_FILE="releases/${RELEASE_DIR}/images.json"
        else
          IMAGES_FILE=$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" \
            | { grep '^releases/.*/images\.json$' || true; } | head -1)
        fi

        if [[ -z "$IMAGES_FILE" || ! -f "$IMAGES_FILE" ]]; then
          echo "ERROR: No images.json found" >&2
          exit 1
        fi
        echo "Using ${IMAGES_FILE}" >&2
        echo "images=$(jq -c . "$IMAGES_FILE")" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: acceptance/go.mod

    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Install yq
      uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

    - name: Install kind
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        install_only: true

    - name: Resolve tested image digests
      id: resolve-digests
      run: |
        set -euo pipefail
        DIGESTS=$(./hack/resolve-tested-digests.sh | jq -c .)
        echo "bundle-digests=${DIGESTS}" >> "$GITHUB_OUTPUT"

    - name: Run acceptance tests
      run: make acceptance

  tag:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tag != false }}
    runs-on: ubuntu-latest
    needs: [acceptance-tests]

    steps:

    - name: Log in to quay.io/enterprise-contract
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        username: ${{ secrets.BUNDLE_PUSH_USER_EC }}
        password: ${{ secrets.BUNDLE_PUSH_PASS_EC }}
        registry: quay.io/enterprise-contract

    - name: Log in to quay.io/conforma
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        username: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        password: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
        registry: quay.io/conforma

    - name: Tag policy images
      env:
        RELEASE_IMAGES: ${{ needs.acceptance-tests.outputs.release-images }}
      run: |
        set -euo pipefail

        echo "$RELEASE_IMAGES" | jq -r '.policy[] | "\(.image)|\(.digest)|\(.mirrors | join(","))"' | \
          while IFS='|' read -r image digest mirrors; do
            echo "Updating ${image}:konflux (from digest ${digest})"
            skopeo copy --all --digestfile image.digest \
              "docker://${image}@${digest}" "docker://${image}:konflux"
            echo "Image digest: $(cat image.digest)"

            IFS=',' read -ra MIRROR_LIST <<< "$mirrors"
            for mirror in "${MIRROR_LIST[@]}"; do
              [[ -z "$mirror" ]] && continue
              echo "Updating ${mirror}:konflux"
              skopeo copy --all --digestfile image.digest \
                "docker://${image}@${digest}" "docker://${mirror}:konflux"
              echo "Image digest: $(cat image.digest)"
            done
          done

    - name: Tag tested images by digest
      env:
        BUNDLE_DIGESTS: ${{ needs.acceptance-tests.outputs.bundle-digests }}
      run: |
        set -euo pipefail

        echo "$BUNDLE_DIGESTS" | jq -r '
          to_entries[] | select(.key | test("tekton-task") | not) |
          "\(.key)|\(.value)"' | while IFS='|' read -r url pinned; do
          repo="${url%:*}"
          echo "Tagging ${pinned} → ${repo}:konflux"
          skopeo copy --all --digestfile image.digest \
            "docker://${pinned}" "docker://${repo}:konflux"
          echo "Image digest: $(cat image.digest)"
        done

  update-task-definitions:
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.run_tekton_task_bundle != false || inputs.run_tekton_catalog != false) }}
    runs-on: ubuntu-latest
    needs: [acceptance-tests, tag]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # This job pushes to tekton-catalog via the App token, not this repo's
        # GITHUB_TOKEN, so don't persist it in the checkout's git config.
        persist-credentials: false

    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Install yq
      uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

    - name: Log in to quay.io/conforma
      env:
        CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
      run: crane auth login quay.io -u "$CONFORMA_USER" -p "$CONFORMA_PASS"

    - name: Extract all tasks from tested bundle
      env:
        BUNDLE_DIGESTS: ${{ needs.acceptance-tests.outputs.bundle-digests }}
      run: |
        set -euo pipefail

        BUNDLE=$(echo "$BUNDLE_DIGESTS" | jq -r '
          to_entries[] | select(.key | test("tekton-task")) | .value')

        if [ -z "$BUNDLE" ]; then
          echo "ERROR: No tekton-task bundle found in BUNDLE_DIGESTS"
          exit 1
        fi

        ./hack/extract-all-bundle-tasks.sh "$BUNDLE" /tmp/catalog-tasks

    - name: Update policy bundle digest in task definitions
      run: ./hack/update-policy-digest.sh /tmp/catalog-tasks/tasks/

    - name: Upload task definitions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: task-definitions
        path: /tmp/catalog-tasks/tasks/

  tekton-task-bundle:
    if: ${{ !cancelled() && !failure() && needs.update-task-definitions.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_tekton_task_bundle != false) }}
    runs-on: ubuntu-latest
    needs: [update-task-definitions]

    steps:
    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Install tkn
      run: |
        set -euo pipefail
        VERSION=$(gh release view --repo tektoncd/cli --json tagName -q .tagName)
        URL="https://github.com/tektoncd/cli/releases/download/${VERSION}/tkn_${VERSION#v}_Linux_x86_64.tar.gz"
        curl -sSL "$URL" | sudo tar -xz -C /usr/local/bin tkn
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Log in to quay.io/conforma
      env:
        CONFORMA_USER: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        CONFORMA_PASS: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
      run: crane auth login quay.io -u "$CONFORMA_USER" -p "$CONFORMA_PASS"

    - name: Download task definitions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: task-definitions
        path: /tmp/catalog-tasks/tasks/

    - name: Push tekton-task bundle
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail

        TASK_FILES=()
        while IFS= read -r f; do
          TASK_FILES+=("-f" "$f")
        done < <(find /tmp/catalog-tasks/tasks -name '*.yaml' -type f)

        # Push this run's bundle to its own unique tag first, then move
        # :konflux to the same digest. Because :konflux is otherwise the only
        # tag the bundle ever gets, each push moves :konflux and leaves the
        # previous digest untagged (orphaned) in Quay. run_id + run_attempt
        # make the per-run tag unique, so every pushed digest keeps a tag.
        # Tagging :konflux from our own unique tag (rather than re-reading the
        # mutable :konflux) also avoids a race where a concurrent run's push
        # could leave this run's digest untagged.
        # The run- prefix reserves a distinct namespace for these bundle tags:
        # the repo also carries Konflux build tags (gh-*, kf-*) and cosign
        # signatures (sha256-*), so a dedicated prefix lets the orphan cleanup
        # (EC-2113) age out run-* tags without matching anything else.
        persistent_tag="run-$(date -u +%Y-%m-%d)-${RUN_ID}-${RUN_ATTEMPT}"
        tkn bundle push "quay.io/conforma/tekton-task:${persistent_tag}" "${TASK_FILES[@]}"
        crane tag "quay.io/conforma/tekton-task:${persistent_tag}" konflux
        echo "Pushed tekton-task bundle as ${persistent_tag} and updated :konflux"

  tekton-catalog:
    if: ${{ !cancelled() && !failure() && needs.update-task-definitions.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_tekton_catalog != false) }}
    runs-on: ubuntu-latest
    needs: [update-task-definitions]

    steps:
    - name: Download task definitions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: task-definitions
        path: /tmp/catalog-tasks/tasks/

    - name: Generate token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.EC_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.EC_AUTOMATION_KEY }}
        owner: conforma
        repositories: tekton-catalog
        # Least privilege: the token only checks out and pushes to tekton-catalog.
        permission-contents: write

    - name: Checkout tekton-catalog
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: conforma/tekton-catalog
        ref: konflux
        path: tekton-catalog
        token: ${{ steps.app-token.outputs.token }}

    - name: Push task definitions to konflux branch
      run: |
        set -euo pipefail

        cd tekton-catalog

        cp -r /tmp/catalog-tasks/tasks/* tasks/

        git add tasks/

        if git diff --cached --quiet; then
          echo "No changes to task definitions"
          exit 0
        fi

        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git commit -m "Update task definitions from tested bundle" \
          -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        git push origin konflux
