name: Test release tools
on:
  pull_request:
    branches: [main]
    paths:
      - 'hack/**'
      - 'spec/**'
      - 'acceptance/**'
      - '.github/actions/release-tools/**'
      - '.github/workflows/*release*'
      - '.github/workflows/konflux-policy.yaml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - name: Test shell tools
        run: |
          git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "$RUNNER_TEMP/shellspec"
          "$RUNNER_TEMP/shellspec/shellspec"
      - run: bash hack/check-release-lead-time_test.sh
      - run: go test ./...
        working-directory: hack/policy-rule-diff
      - run: go test ./... -skip '^TestFeatures$'
        working-directory: acceptance
