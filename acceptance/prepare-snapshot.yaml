# Task that writes a snapshot JSON to a file and pushes it as a Trusted Artifact
# to a local OCI registry for use by verify-conforma-konflux-ta.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-snapshot
spec:
  params:
    - name: SNAPSHOT
      type: string
      description: Snapshot JSON to write as a trusted artifact
  results:
    - name: SOURCE_DATA_ARTIFACT
      description: Trusted artifact URI containing the snapshot
  steps:
    - name: write-snapshot
      image: busybox:latest
      env:
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
      script: |
        #!/bin/sh
        mkdir -p /var/workdir/source
        printf '%s' "${SNAPSHOT}" > /var/workdir/source/snapshot.json
        echo "Snapshot written:"
        cat /var/workdir/source/snapshot.json
      volumeMounts:
        - name: workdir
          mountPath: /var/workdir
    - name: create-trusted-artifact
      image: quay.io/redhat-appstudio/build-trusted-artifacts:e02102ede09aa07187cba066ad547a54724e5cf4
      args:
        - create
        - --store
        - local-registry.registry.svc.cluster.local:5000/trusted-artifacts
        - $(results.SOURCE_DATA_ARTIFACT.path)=/var/workdir/source
      env:
        - name: ORAS_OPTIONS
          value: "--plain-http"
      volumeMounts:
        - name: workdir
          mountPath: /var/workdir
  volumes:
    - name: workdir
      emptyDir: {}
