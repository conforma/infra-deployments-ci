---
name: konflux-policy

on:
  workflow_dispatch:
  # Disabled as part of konflux release freeze and ITN-2026-00051
  # schedule:
  #   # At 08:30 UTC on Tuesday
  #   - cron: '30 8 * * 2'

permissions:
  contents: read

jobs:
  acceptance-tests:
    runs-on: ubuntu-latest
    outputs:
      bundle-digests: ${{ steps.resolve-digests.outputs.bundle-digests }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: acceptance/go.mod

    - name: Install crane
      uses: imjasonh/setup-crane@v0.4

    - name: Install yq
      uses: mikefarah/yq@v4

    - name: Install kind
      uses: helm/kind-action@v1
      with:
        install_only: true

    - name: Resolve tested image digests
      id: resolve-digests
      run: |
        set -euo pipefail
        DIGESTS=$(./hack/resolve-tested-digests.sh)
        echo "bundle-digests=${DIGESTS}" >> "$GITHUB_OUTPUT"

    - name: Run acceptance tests
      run: make acceptance

  tag:
    runs-on: ubuntu-latest
    needs: [acceptance-tests]

    steps:

    - name: Log in to quay.io/enterprise-contract
      uses: redhat-actions/podman-login@v1
      with:
        username: ${{ secrets.BUNDLE_PUSH_USER_EC }}
        password: ${{ secrets.BUNDLE_PUSH_PASS_EC }}
        registry: quay.io/enterprise-contract

    - name: Log in to quay.io/conforma
      uses: redhat-actions/podman-login@v1
      with:
        username: ${{ secrets.BUNDLE_PUSH_USER_CONFORMA }}
        password: ${{ secrets.BUNDLE_PUSH_PASS_CONFORMA }}
        registry: quay.io/conforma

    - name: Tag latest release policy
      run: |
        set -euo pipefail

        for repo in enterprise-contract/ec-release-policy conforma/release-policy; do
          echo "Updating quay.io/${repo}:konflux"
          skopeo copy --all --digestfile image.digest \
            docker://quay.io/${repo}:latest docker://quay.io/${repo}:konflux
          echo "Image digest: $(cat image.digest)"
        done

    - name: Tag latest task policy
      run: |
        set -euo pipefail

        for repo in enterprise-contract/ec-task-policy conforma/task-policy; do
          echo "Updating quay.io/${repo}:konflux"
          skopeo copy --all --digestfile image.digest \
            docker://quay.io/${repo}:latest docker://quay.io/${repo}:konflux
          echo "Image digest: $(cat image.digest)"
        done

    - name: Tag tested images by digest
      env:
        BUNDLE_DIGESTS: ${{ needs.acceptance-tests.outputs.bundle-digests }}
      run: |
        set -euo pipefail

        echo "$BUNDLE_DIGESTS" | jq -r 'to_entries[] | "\(.key)|\(.value)"' | while IFS='|' read -r url pinned; do
          repo="${url%:*}"
          echo "Tagging ${pinned} → ${repo}:konflux"
          skopeo copy --all --digestfile image.digest \
            "docker://${pinned}" "docker://${repo}:konflux"
          echo "Image digest: $(cat image.digest)"
        done

  tekton-catalog-release:
    runs-on: ubuntu-latest
    needs: [acceptance-tests, tag]

    steps:
    - uses: actions/checkout@v4

    - name: Install crane
      uses: imjasonh/setup-crane@v0.4

    - name: Install yq
      uses: mikefarah/yq@v4

    - name: Extract tested tasks from pinned bundle digests
      env:
        BUNDLE_DIGESTS: ${{ needs.acceptance-tests.outputs.bundle-digests }}
      run: ./hack/extract-tested-tasks.sh /tmp/catalog-tasks

    - name: Generate token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ secrets.EC_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.EC_AUTOMATION_KEY }}
        owner: conforma
        repositories: tekton-catalog

    - name: Checkout tekton-catalog
      uses: actions/checkout@v4
      with:
        repository: conforma/tekton-catalog
        ref: konflux
        path: tekton-catalog
        token: ${{ steps.app-token.outputs.token }}

    - name: Push task definitions to konflux branch
      run: |
        set -euo pipefail

        cd tekton-catalog

        # Copy extracted tasks into the catalog
        cp -r /tmp/catalog-tasks/tasks/* tasks/

        git add tasks/

        # Check if there are staged changes
        if git diff --cached --quiet; then
          echo "No changes to task definitions"
          exit 0
        fi

        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git commit -m "Update task definitions from tested bundle

${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        git push origin konflux
